name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM/MLIR 15 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build llvm-15-dev libmlir-15-dev mlir-15-tools clang-15
      - name: Configure and build
        run: |
          cmake -S . -B out -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-15 -DCMAKE_CXX_COMPILER=clang++-15 \
            -DMLIR_DIR=/usr/lib/llvm-15/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-15/lib/cmake/llvm
          cmake --build out
      - name: Toolchain smoke test
        run: |
          BIN=$(find out -type f -name neutrino-gen -perm -u+x | head -1)
          echo "binary: $BIN"; "$BIN" --version && "$BIN" --version-json
          PKG=$(find out -type f -name backend-package.json -path '*solidity*' | head -1)
          echo "solidity backend package: $PKG"; test -n "$PKG"
          test -x "$(dirname "$PKG")/bin/neutrino-solidity-backend"
      - uses: actions/upload-artifact@v4
        with:
          name: neutrino-gen-linux-x64
          path: out/**/neutrino-gen
